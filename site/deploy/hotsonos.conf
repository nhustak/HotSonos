# --- HotSonos landing page + privacy policy (hotsonos.com) ---------------------
# Static files: ~/clover-dev/sites/hotsonos (source: HotSonos repo, site/).
# Cert: Porkbun free SSL bundle -> certs/hotsonos.com.fullchain.pem + .key
server {
    listen 80;
    server_name hotsonos.com www.hotsonos.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name hotsonos.com www.hotsonos.com;
    ssl_certificate     /etc/nginx/certs/hotsonos.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/hotsonos.com.key;

    root /usr/share/nginx/sites/hotsonos;
    index index.html;
    error_page 404 /404.html;

    location = /privacy {
        try_files /privacy.html =404;
    }
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
