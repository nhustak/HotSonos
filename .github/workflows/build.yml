name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore HotSonos.slnx

      - name: Build
        run: dotnet build HotSonos.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test HotSonos.slnx --configuration Release --no-build --verbosity normal

      - name: Publish (self-contained win-x64)
        run: dotnet publish src/HotSonos.App/HotSonos.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/publish

      - name: Build installer (MSI)
        run: dotnet build installer/HotSonos.Installer.wixproj -c Release

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v7
        with:
          name: HotSonos-msi
          path: installer/bin/Release/HotSonos.msi
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action default is "tools platform-tools". The old "tools"
          # package was removed from the SDK repo, so that default fails with
          # "Failed to find package 'tools'". cmdline-tools is installed by
          # the action itself; platform-tools is the package we still need.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # Android only. iOS is a separate Codemagic workflow (codemagic.yaml) and is
      # not a target on this runner. -f net10.0-android keeps it that way even
      # if a future image is macOS, where the csproj also lists net10.0-ios.
      - name: Build phone
        run: dotnet build src/HotSonos.Remote/HotSonos.Remote.csproj -c Release -f net10.0-android --nologo

  wear:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Build watch
        working-directory: src/HotSonos.Wear
        run: chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload watch APK
        uses: actions/upload-artifact@v7
        with:
          name: HotSonos-wear-debug
          path: src/HotSonos.Wear/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
